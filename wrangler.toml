name = "eval-exec-cafe"
main = "worker/index.ts"
compatibility_date = "2025-02-01"

routes = [
  { pattern = "cafe.eval-exec.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws"]

[[ durable_objects.bindings ]]
name = "CAFE_HUB"
class_name = "CafeHubDurableObject"

[[ migrations ]]
tag = "v1"
new_sqlite_classes = ["CafeHubDurableObject"]
